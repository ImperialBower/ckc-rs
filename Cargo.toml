[package]
name = "ckc-rs"
description = "A no_std, zero-dependency Cactus Kev poker hand evaluation kernel"
version = "0.2.0"
authors = ["electronicpanopticon <gaoler@electronicpanopticon.com>"]
repository = "https://github.com/ImperialBower/ckc-rs.git"
homepage = "https://github.com/ImperialBower/ckc-rs"
edition = "2024"
rust-version = "1.85"
# `AND`, not `OR`: this is not a dual-license choice. The crate itself is
# Apache-2.0 (./LICENSE), and it vendors Vladislav Supalov's MIT-licensed Cactus
# Kev lookup tables (./src/standard52/lookups/, attribution in that directory's
# LICENSE). `src/` is not excluded, so both ship in the published package and
# both bind the consumer.
license = "Apache-2.0 AND MIT"
exclude = [".github/workflows/*", ".gitignore", "Cargo.lock", "tools/*", "tests/golden/*"]

[features]
default    = ["standard52", "std"]
## The 52-card French deck: `Card`, `Rank`, `Suit`, `CardNumber`, and the
## Cactus Kev lookup tables. Its own feature so that a future deck family
## (Ganjifa, etc.) can be added without forcing this one on.
standard52 = []
std        = ["alloc"]
## Enables the allocating conveniences: `Card::bit_string`, the pretty
## rank-flag formatters, and anything else returning `String`/`Vec`.
## The evaluator itself never allocates.
alloc      = []
## Serialization support.
##
## NOTE: this feature implies `alloc`, and there is currently no way to get
## serde without it. `Card` serializes as its human-readable string form
## (`"A♠"`) to stay wire-compatible with the hand-history YAML in pkcore's
## `data/hands/`, and the current impl round-trips through `String`, whose
## serde impls are themselves gated on `serde/alloc`.
##
## This coupling is an artifact of the impl, not a hard requirement: a
## `Visitor` using `visit_str` plus a stack buffer would serialize the same
## bytes without allocating. If that lands, `alloc` will be dropped from this
## list — a widening, so it will not be a breaking change.
serde      = ["dep:serde", "alloc", "serde/alloc"]

[dependencies]
serde = { version = "1.0", default-features = false, features = ["derive"], optional = true }

[dev-dependencies]
rstest = "0.25.0"
